name: Mihomo Pipeline

on:
  schedule:
    - cron: "0 20 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: mihomo-pipeline
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}
  GIST_ID: "942e3c9de1396e6b3bf4afab0f054349"

jobs:
  aggregate-and-filter:
    name: Aggregate & Filter Protocols
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install mihomo binary
        run: |
          mkdir -p clash
          curl -L --fail --retry 3 -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz"
          gunzip -c mihomo.gz > clash/clash-linux-amd
          chmod +x clash/clash-linux-amd
          ./clash/clash-linux-amd -v

      - name: Install dependencies
        run: pip3 install -r requirements.txt

      - name: Run aggregator000
        run: python -u subscribe/process.py --overwrite --special-protocols --skip-alive-check --skip-remark
        env:
          ENABLE_SPECIAL_PROTOCOLS: "true"

      - name: Fetch aggregate and filter protocols
        run: |
          set -euo pipefail
          mkdir -p output/checked
          curl -fsSL --retry 3 "https://gist.githubusercontent.com/pq0000/${GIST_ID}/raw/all.yaml" -o output/checked/aggregate.yaml
          python3 -m pip install PyYAML
          python3 .github/workflows/scripts/filter_protocols.py output/checked/aggregate.yaml output/checked/filtered.yaml

      - name: Upload filtered nodes
        uses: actions/upload-artifact@v4
        with:
          name: filtered-nodes
          path: output/checked/filtered.yaml
          if-no-files-found: error

  alive-check:
    name: Alive Check & Publish
    runs-on: ubuntu-latest
    needs: aggregate-and-filter
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip3 install -r requirements.txt

      - name: Download subs-check binary
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then FILE="subs-check_Linux_x86_64.tar.gz";
          elif [ "$ARCH" = "aarch64" ]; then FILE="subs-check_Linux_aarch64.tar.gz";
          else echo "Unsupported arch: $ARCH"; exit 1; fi
          curl -L --fail --retry 3 -o subs-check.tar.gz "https://github.com/beck-8/subs-check/releases/download/v1.6.5/${FILE}"
          tar -xzf subs-check.tar.gz
          chmod +x subs-check

      - name: Download filtered nodes
        uses: actions/download-artifact@v4
        with:
          name: filtered-nodes
          path: output/checked

      - name: Run subs-check
        run: ./run_subs_check.sh output/checked/filtered.yaml 900
        env:
          SUBS_CHECK_BIN: ./subs-check
          SUBS_CHECK_CONF: subscribe/subs-check-conf/config.yaml
          SERVE_PORT: 11023
          SERVE_PATH: /all.yaml

      - name: Validate and publish checked nodes
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, yaml
          with open("output/all.yaml", encoding="utf-8") as f:
              content = f.read()
          data = yaml.safe_load(content)
          nodes = data.get("proxies") if isinstance(data, dict) else None
          allowed = {"vless", "hysteria2", "mieru", "masque"}
          if not isinstance(nodes, list) or not nodes:
              raise SystemExit("subs-check output must contain non-empty proxies")
          if any(not isinstance(node, dict) or str(node.get("type", "")).lower() not in allowed for node in nodes):
              raise SystemExit("subs-check output contains invalid or unexpected proxy types")
          alive = sum(node.get("alive") is True for node in nodes)
          print(f"nodes={len(nodes)}, alive={alive}, dead={len(nodes)-alive}")
          token = os.environ.get("PUSH_TOKEN") or os.environ.get("GH_TOKEN")
          if not token:
              raise SystemExit("missing Gist token")
          request = urllib.request.Request(
              f"https://api.github.com/gists/{os.environ['GIST_ID']}",
              data=json.dumps({"files": {"all.yaml": {"content": content}}}).encode(),
              method="PATCH",
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json", "Accept": "application/vnd.github+json", "User-Agent": "aggregator"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              print(f"push status: {response.status}")
          PY
