name: Mihomo Pipeline

on:
  schedule:
    # China 04:50 UTC+8 (= UTC 20:50 prev day) -> scan done ~04:55, sub ready 05:00
    - cron: "50 20 * * *"
    # China 16:50 UTC+8 (= UTC 08:50) -> scan done ~16:55, sub ready 17:00
    - cron: "50 8 * * *"
  workflow_dispatch:

concurrency:
  group: mihomo-pipeline
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}
  SKIP_ALIVE_CHECK: ${{ vars.SKIP_ALIVE_CHECK }}
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}
  GIST_ID: "942e3c9de1396e6b3bf4afab0f054349"

jobs:
  aggregate:
    name: Aggregate Nodes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Run aggregator000
        run: python -u subscribe/process.py --overwrite

  subs-check:
    name: Subs-Check Detect
    runs-on: ubuntu-latest
    needs: aggregate
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Download subs-check binary
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then FILE="subs-check_Linux_x86_64.tar.gz";
          elif [ "$ARCH" = "aarch64" ]; then FILE="subs-check_Linux_aarch64.tar.gz";
          else echo "Unsupported arch: $ARCH"; exit 1; fi
          curl -L --fail --retry 3 -o subs-check.tar.gz "https://github.com/beck-8/subs-check/releases/download/v1.6.5/${FILE}"
          tar -xzf subs-check.tar.gz
          chmod +x subs-check
          ls -la subs-check

      - name: Fetch fresh all.yaml from gist
        run: |
          mkdir -p output/checked
          echo "Fetching fresh all.yaml from gist..."
          curl -fsSL -o output/checked/config.yaml "https://gist.githubusercontent.com/pq0000/${GIST_ID}/raw/all.yaml"
          echo "=== aggregator output (from gist) ==="
          ls -la output/checked/config.yaml
          head -c 600 output/checked/config.yaml 2>/dev/null || true
          echo

      - name: Run subs-check (vless / hysteria2 / mieru)
        run: |
          chmod +x run_subs_check.sh
          ./run_subs_check.sh output/checked/config.yaml 900 || true
        env:
          SUBS_CHECK_BIN: ./subs-check
          SUBS_CHECK_CONF: subscribe/subs-check-conf/config.yaml
          SERVE_PORT: 11023
          SERVE_PATH: /all.yaml

      - name: Upload subs-check output
        uses: actions/upload-artifact@v4
        with:
          name: subs-check-output
          path: output/all.yaml
          if-no-files-found: warn

  push-filter:
    name: Push Filtered Nodes To Gist
    runs-on: ubuntu-latest
    needs: subs-check
    timeout-minutes: 10
    steps:
      - name: Download subs-check output
        uses: actions/download-artifact@v4
        with:
          name: subs-check-output
          path: output

      - name: Push detected nodes to Gist
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, ssl, sys
          GIST_ID = "942e3c9de1396e6b3bf4afab0f054349"
          p = "output/all.yaml"
          if not os.path.exists(p):
              print("[push] no all.yaml found")
              sys.exit(0)
          with open(p, "r", encoding="utf-8") as f:
              content = f.read()
          # 仅保留目标协议：vless / hysteria2 / mieru
          try:
              import yaml
              data = yaml.safe_load(content)
              nodes = data.get("proxies", []) if isinstance(data, dict) else []
              target = {"vless", "hysteria2", "mieru"}
              keep = [n for n in nodes if str(n.get("type", "")).lower() in target]
              content = yaml.dump({"proxies": keep}, allow_unicode=True, default_flow_style=False)
              print("[push] nodes:", len(keep))
          except Exception as e:
              print("[push] yaml err:", e)
          tok = os.environ.get("PUSH_TOKEN") or os.environ.get("GH_TOKEN")
          if not tok:
              print("[push] no token")
              sys.exit(1)
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          body = json.dumps({"files": {"all.yaml": {"content": content}}}).encode("utf-8")
          req = urllib.request.Request(
              "https://api.github.com/gists/" + GIST_ID,
              data=body, method="PATCH",
              headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json", "Accept": "application/vnd.github+json", "User-Agent": "aggregator"},
          )
          try:
              with urllib.request.urlopen(req, timeout=60, context=ctx) as r:
                  print("[push] status", r.status)
          except Exception as e:
              print("[push] error", e)
              sys.exit(1)
          EOF