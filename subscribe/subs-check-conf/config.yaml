# Pinned subs-check v1.6.5 (embedded mihomo v1.19.31 supports all four types).
# run_subs_check.sh makes a private per-round copy; never give this process
# a remote saver, history nodes, global kill callback or publish token.
print-progress: false
concurrent: 32
media-concurrent: 4
speed-concurrent: 3
shuffle-test-order: true
check-interval: 1440
success-limit: 0
timeout: 5000
alive-test-url: https://www.gstatic.com/generate_204
# The runner retains this strict first-round threshold. Failed speed requests
# and below-threshold nodes are counted separately from alive-stage failures.
speed-test-url: https://speed.cloudflare.com/__down?bytes=10485760
min-speed: 300
download-timeout: 15
download-mb: 5
total-speed-limit: 0
rename-node: false
node-type:
  - vless
  - hysteria2
  - mieru
  - masque
filter:
  - "\\|[0-1]?[0-9]%"
media-check: true
media-check-timeout: 5
platforms:
  - iprisk
keep-days: 0
output-dir: output
# The runtime copy enables ONLY a loopback authenticated API to snapshot real
# /api/status counters. Its random api-key/config and raw logs are never artifacts.
enable-web-ui: false
listen-port: ""
api-key: ""
callback-script: subscribe/subs-check-conf/callback.sh
save-method: local
sub-store-port: ""
sub-urls-retry: 2
sub-urls-concurrent: 1
sub-urls-get-ua: clash.meta
ipv6: true
sub-urls:
  - http://127.0.0.1:11023/all.yaml
