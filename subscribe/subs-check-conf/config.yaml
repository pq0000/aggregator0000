print-progress: false
concurrent: 120
media-concurrent: 5
speed-concurrent: 8
shuffle-test-order: true
enable-speedtest: true
check-interval: 1440
success-limit: 100
timeout: 5000
alive-test-url: http://gstatic.com/generate_204
speed-test-url: https://github.com/AaronFeng753/Waifu2x-Extension-GUI/releases/download/v2.21.12/Waifu2x-Extension-GUI-v2.21.12-Portable.7z
min-speed: 300
download-timeout: 15
download-mb: 12
total-speed-limit: 0
rename-node: false
# 只保留用户指定的 3 种协议：vless / hysteria2 / mieru
# （masque 等其它协议不在本次目标范围内，不参与检测与输出）
node-type:
  - vless
  - hysteria2
  - mieru
filter: []
media-check: false
keep-days: 0
output-dir: "output"
enable-web-ui: false
api-key: ""
callback-script: "subscribe/subs-check-conf/callback.sh"
save-method: local
github-gist-id: "942e3c9de1396e6b3bf4afab0f054349"
github-token: ""
github-api-mirror: ""
sub-urls-retry: 2
sub-urls-concurrent: 10
sub-urls-get-ua: "clash.meta"
ipv6: true
# 由 workflow 在运行时通过环境变量覆盖为本机 aggregator 输出的 HTTP 地址
# （默认指向本机 serve_aggregator_output.py 暴露的订阅链接，避免依赖 gist raw URL 的缓存延迟）
sub-urls:
  - "http://127.0.0.1:11023/all.yaml"
